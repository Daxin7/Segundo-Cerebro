<script>
// ============================================
// GRAPH VIEW CANVAS BACKGROUND
// ============================================
const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
let nodes = [];
let animationId = null;
let width = 0;
let height = 0;
const NODE_COUNT = 60;
const CONNECTION_DISTANCE = 180;
const NODE_SPEED = 0.3;

function resizeCanvas() {
width = window.innerWidth;
height = window.innerHeight;
canvas.width = width;
canvas.height = height;
}

function initNodes() {
nodes = [];
for (let i = 0; i < NODE_COUNT; i++) {
nodes.push({
x: Math.random() * width,
y: Math.random() * height,
vx: (Math.random() - 0.5) * NODE_SPEED,
vy: (Math.random() - 0.5) * NODE_SPEED,
radius: Math.random() * 2 + 1.5,
hue: 220 + Math.random() * 60
});
}
}

function getThemeColors() {
const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
return {
nodeColor: isDark ? 'rgba(137, 180, 250, 0.7)' : 'rgba(30, 102, 245, 0.7)',
lineColor: isDark ? 'rgba(137, 180, 250, 0.15)' : 'rgba(30, 102, 245, 0.15)',
glowColor: isDark ? 'rgba(137, 180, 250, 0.4)' : 'rgba(30, 102, 245, 0.4)'
};
}

function drawNodes() {
const colors = getThemeColors();
ctx.clearRect(0, 0, width, height);

for (let i = 0; i < nodes.length; i++) {
const node = nodes[i];
node.x += node.vx;
node.y += node.vy;

if (node.x < 0 || node.x > width) node.vx *= -1;
if (node.y < 0 || node.y > height) node.vy *= -1;

node.x = Math.max(0, Math.min(width, node.x));
node.y = Math.max(0, Math.min(height, node.y));

ctx.beginPath();
ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
ctx.fillStyle = colors.nodeColor;
ctx.fill();
}

for (let i = 0; i < nodes.length; i++) {
for (let j = i + 1; j < nodes.length; j++) {
const dx = nodes[i].x - nodes[j].x;
const dy = nodes[i].y - nodes[j].y;
const dist = Math.sqrt(dx * dx + dy * dy);

if (dist < CONNECTION_DISTANCE) {
const opacity = (1 - dist / CONNECTION_DISTANCE) * 0.3;
ctx.beginPath();
ctx.moveTo(nodes[i].x, nodes[i].y);
ctx.lineTo(nodes[j].x, nodes[j].y);
ctx.strokeStyle = colors.lineColor.replace('0.15', opacity.toFixed(2));
ctx.lineWidth = 0.5;
ctx.stroke();
}
}
}

animationId = requestAnimationFrame(drawNodes);
}

function startGraph() {
resizeCanvas();
initNodes();
drawNodes();
}

function stopGraph() {
if (animationId) cancelAnimationFrame(animationId);
}

window.addEventListener('resize', () => {
resizeCanvas();
});

document.addEventListener('themechange', () => {
ctx.clearRect(0, 0, width, height);
});

// ============================================
// SIDEBAR NAVIGATION STRUCTURE
// ============================================
const navStructure = [

]

]

]
},

items: [
{ label: 'Dibujo 2026-08-20 16:44', path: 'Excalidraw/Drawing 2026-08-20 16.44.28.excalidraw.md', icon: '🎨' },
{ label: 'Dibujo 2026-08-20 16:45', path: 'Excalidraw/Drawing 2026-08-20 16.45.36.excalidraw.md', icon: '🎨' }
]
},
{
title: '⚙️ OpenCode Skills',
items: [
{ label: 'preparacion-examen', path: '.opencode/skills/preparacion-examen/SKILL.md', icon: '📚' },
{ label: 'generar-flashcards', path: '.opencode/skills/generar-flashcards/SKILL.md', icon: '🃏' },
{ label: 'glosario-materia', path: '.opencode/skills/glosario-materia/SKILL.md', icon: '📖' },
{ label: 'cronograma-examen', path: '.opencode/skills/cronograma-examen/SKILL.md', icon: '📅' },
{ label: 'exportar-notas', path: '.opencode/skills/exportar-notas/SKILL.md', icon: '📤' },
{ label: 'resumen-sesion', path: '.opencode/skills/resumen-sesion/SKILL.md', icon: '💾' },
{ label: 'revision-bandeja', path: '.opencode/skills/revision-bandeja/SKILL.md', icon: '🗂️' },

{ label: 'cerrar-semana', path: '.opencode/skills/cerrar-semana/SKILL.md', icon: '🔚' },
{ label: 'modo-estudio', path: '.opencode/skills/modo-estudio/SKILL.md', icon: '🎓' }
]
}
];

// ============================================
// RENDER SIDEBAR
// ============================================
const sidebarNav = document.getElementById('sidebar-nav');

function renderSidebar() {
sidebarNav.innerHTML = '';
navStructure.forEach(section => {
const sectionEl = document.createElement('div');
sectionEl.className = 'nav-section';

const titleEl = document.createElement('div');
titleEl.className = 'nav-section-title';
titleEl.textContent = section.title;
sectionEl.appendChild(titleEl);

section.items.forEach((item, idx) => {
const btn = document.createElement('button');
btn.className = 'nav-item';
btn.dataset.path = item.path;
btn.dataset.isFolder = item.isFolder || 'false';
btn.innerHTML = `<span class="icon">${item.icon}</span><span>${item.label}</span>`;
btn.addEventListener('click', () => loadContent(item.path, item.label, item.isFolder));
sectionEl.appendChild(btn);
});

sidebarNav.appendChild(sectionEl);
});
}

renderSidebar();

// ============================================
// MARKDOWN LOADING & RENDERING
// ============================================
let currentPath = null;

async function loadContent(path, label, isFolder = false) {
currentPath = path;
const contentBody = document.getElementById('content-body');
const contentTitle = document.getElementById('content-title');
const contentSubtitle = document.getElementById('content-subtitle');
const breadcrumb = document.getElementById('breadcrumb');

document.querySelectorAll('.nav-item').forEach(btn => {
btn.classList.toggle('active', btn.dataset.path === path);
});

if (isFolder) {
contentBody.innerHTML = `<div class="loading">Cargando carpeta: ${label}...</div>`;
try {
const response = await fetch(path);
if (!response.ok) throw new Error('No se puede listar carpeta vía HTTP');
const text = await response.text();
const files = parseDirectoryListing(text, path);
renderFileList(contentBody, files, path, label);
} catch {
contentBody.innerHTML = `
<div class="empty-state">
<div class="icon">📁</div>
<h2>${label}</h2>
<p>Esta es una carpeta. GitHub Pages no permite listar directorios directamente. Haz clic en archivos individuales del menú lateral para ver su contenido.</p>
</div>
`;
}
typewriterEffect(contentTitle, label);
contentSubtitle.textContent = `Carpeta: ${path}`;
breadcrumb.innerHTML = `<span>Inicio</span> / <span>${label}</span>`;
return;
}

contentBody.innerHTML = '<div class="loading">Cargando nota...</div>';
typewriterEffect(contentTitle, label);
contentSubtitle.textContent = `Nota: ${path}`;
breadcrumb.innerHTML = `<span>Inicio</span> / <span>${label}</span>`;

try {
const response = await fetch(path);
if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
const markdown = await response.text();
const html = marked.parse(markdown);
contentBody.innerHTML = html;
} catch (err) {
contentBody.innerHTML = `
<div class="empty-state">
<div class="icon">⚠️</div>
<h2>Error al cargar</h2>
<p>No se pudo cargar <code>${path}</code>: ${err.message}</p>
<p>Verifica que el archivo exista en el repositorio y que GitHub Pages haya desplegado los cambios.</p>
</div>
`;
}

closeMobileMenu();
}

function parseDirectoryListing(html, basePath) {
const files = [];
const parser = new DOMParser();
const doc = parser.parseFromString(html, 'text/html');
const links = doc.querySelectorAll('a');
links.forEach(a => {
const href = a.getAttribute('href');
if (href && !href.startsWith('..') && !href.startsWith('?') && !href.startsWith('#')) {
const name = a.textContent.trim();
const fullPath = basePath.endsWith('/') ? basePath + href : basePath + '/' + href;
files.push({ name, path: fullPath, isDir: href.endsWith('/') });
}
});
return files;
}

function renderFileList(container, files, basePath, label) {
if (files.length === 0) {
container.innerHTML = `<div class="empty-state"><div class="icon">📂</div><h2>${label}</h2><p>La carpeta está vacía o no se pudo listar.</p></div>`;
return;
}
let html = '<ul style="list-style:none; padding:0;">';
files.forEach(f => {
const icon = f.isDir ? '📁' : f.name.endsWith('.md') ? '📄' : '📎';
html += `<li style="margin:0.5rem 0;"><button class="nav-item" style="width:100%; justify-content:flex-start; background:none; border:none; color:inherit; font:inherit; cursor:pointer; padding:0.5rem;" onclick="loadContent('${f.path}', '${f.name.replace(/'/g, "\\'")}', ${f.isDir})"><span class="icon">${icon}</span>${f.name}</button></li>`;
});
html += '</ul>';
container.innerHTML = html;
}

// ============================================
// TYPEWRITER EFFECT
// ============================================
function typewriterEffect(element, text, speed = 25) {
element.textContent = '';
element.classList.add('typewriter');
let i = 0;
const cursor = document.createElement('span');
cursor.className = 'typewriter-cursor';
element.appendChild(cursor);

function type() {
if (i < text.length) {
element.insertBefore(document.createTextNode(text[i]), cursor);
i++;
setTimeout(type, speed);
} else {
cursor.remove();
element.classList.remove('typewriter');
}
}
type();
}

// ============================================
// THEME TOGGLE
// ============================================
const themeToggle = document.getElementById('theme-toggle');
const themeIcon = document.getElementById('theme-icon');

function applyTheme(theme) {
document.documentElement.setAttribute('data-theme', theme);
localStorage.setItem('theme', theme);
themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
themeToggle.querySelector('span').textContent = theme === 'dark' ? '🌙 Modo Oscuro' : '☀️ Modo Claro';
document.dispatchEvent(new CustomEvent('themechange'));
}

themeToggle.addEventListener('click', () => {
const current = document.documentElement.getAttribute('data-theme') || 'dark';
applyTheme(current === 'dark' ? 'light' : 'dark');
});

const savedTheme = localStorage.getItem('theme') || 'dark';
applyTheme(savedTheme);

// ============================================
// MOBILE MENU
// ============================================
const mobileMenuBtn = document.getElementById('mobile-menu-btn');
const sidebar = document.getElementById('sidebar');

mobileMenuBtn.addEventListener('click', () => {
sidebar.classList.toggle('open');
});

function closeMobileMenu() {
sidebar.classList.remove('open');
}

document.addEventListener('click', (e) => {
if (window.innerWidth <= 1024 && !sidebar.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
closeMobileMenu();
}
});

// ============================================
// INIT
// ============================================
startGraph();

if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
